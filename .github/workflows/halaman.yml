name: Terbitkan Nalar Aksara

on:
  push:
    branches: [io]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: halaman
  cancel-in-progress: true

jobs:
  terbitkan:
    environment:
      name: github-pages
      url: ${{ steps.tayang.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil sumber
        uses: actions/checkout@v4
      - name: Siapkan halaman
        uses: actions/configure-pages@v5
      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Terbitkan
        id: tayang
        uses: actions/deploy-pages@v4
